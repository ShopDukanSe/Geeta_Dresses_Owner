/* Paste the /exec URL from Deploy > New deployment (type "Web app") here. Same placeholder
   string as catalogue.html — a single find-replace fills both once you have deployed Code.gs. */
const API_URL = "https://script.google.com/macros/s/AKfycbw4KrkN3F6oWTDto9RVRtMmfrgbaE3g3qP6tD6BqoTNzecpj0beAmiEpkCc1yzoQq0/exec";
function apiConfigured(){ return typeof API_URL==="string" && API_URL && !API_URL.includes("PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"); }
/* Owner console needs Orders/Issues too, which the public action=all deliberately omits
   (it's callable by anyone who finds API_URL in the page source). This page always uses the
   action=ownerAll endpoint instead — there's no login/passcode anymore, access is controlled
   purely by this page's own URL being unlisted/unshared. */
async function apiGetAll(){
  const url = API_URL + (API_URL.includes("?")?"&":"?") + "action=ownerAll";
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* Sent as GET (not POST) — Apps Script Web App POST responses often come back without an
   Access-Control-Allow-Origin header once this page is hosted on a different origin (e.g.
   GitHub Pages), so the browser blocks reading the response even though the call succeeds
   server-side. GET doesn't have this problem, so the action+payload travels as a JSON query param. */
async function apiPost(action, payload){
  const url = API_URL + (API_URL.includes("?")?"&":"?") + "action=" + encodeURIComponent(action) + "&data=" + encodeURIComponent(JSON.stringify(Object.assign({action}, payload)));
  const res = await fetch(url);
  const data = await res.json();
  if(!data || data.ok===false) throw new Error((data && data.error) || "API error");
  return data;
}
/* No login anymore — owner-mutating actions used to carry a phone+passcode for Code.gs to
   verify; that check is now disabled server-side (requireOwner_ in Code.gs), so this just
   calls apiPost directly and swallows a failure (change still kept locally either way). */
async function apiPostSafe(action, payload, failMsg){
  if(!apiConfigured()) return null;
  try{ return await apiPost(action, payload); }
  catch(err){ console.warn("Geeta Dresses owner: "+action+" API failed — change kept locally only.", err); if(failMsg) toast(failMsg); return null; }
}

/* Resizes/compresses an uploaded image to a small JPEG data URL — keeps it well under Google
   Sheets' ~50,000-char-per-cell limit once base64-encoded (a full-res phone photo blows past
   that easily). Used for banner uploads here; catalogue.html has the same helper for payment
   screenshots and issue photos. */
function resizeImageFile_(file, maxDim=900, quality=0.6){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const scale=maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
        const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function haversineKm(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }

/* Fetches products/stock/villages/zone/config/policies/orders/issues from the Apps Script backend
   and merges them over the local demo data. Always boots from loadLocal() first so the console
   works before API_URL is deployed or if the fetch fails. */
async function loadFromApi(){
  loadLocal();
  if(!apiConfigured()) return;
  try{
    const data = await apiGetAll();
    if(data.products && data.products.length) PRODUCTS = data.products.map(mapApiProduct);
    if(data.stock && Object.keys(data.stock).length) S.stock = data.stock;
    if(data.villages && data.villages.length) S.config.villages = data.villages;
    if(data.config){
      applyRemoteConfig(data.config);
      if(data.config.cutoff_hour!=null) S.config.cutoffHour = Number(data.config.cutoff_hour)||S.config.cutoffHour;
      if(data.config.zone_center_lat!=null && data.config.zone_center_lng!=null){
        S.config.zone = { lat:Number(data.config.zone_center_lat), lng:Number(data.config.zone_center_lng), radiusKm:Number(data.config.zone_radius_km)||DEFAULT_ZONE_RADIUS_KM };
      }
      [1,2,3].forEach(n=>{ if(data.config["banner_"+n]!=null) S.config["banner_"+n]=data.config["banner_"+n]; });
    }
    if(data.policies) S.policies = Object.assign({}, POLICY_DEFAULTS, data.policies);
    if(data.orders && data.orders.length){ S.orders = data.orders.map(mapApiOrder); S.baseVotes = S.baseVotes||{}; PRODUCTS.forEach((p,i)=>{ if(!S.baseVotes[p.id]) S.baseVotes[p.id]={like:8+((i*7)%15),dislike:1+((i*3)%5)}; }); }
    save();
  }catch(err){
    console.warn("Geeta Dresses owner: API unreachable, using local demo data.", err);
  }
}

let invFormState = null; // null = not showing a form; "new" = add-product form; otherwise a product id being edited
function nextProductId(category){
  // Collision-safe scheme: <category initial>-<next unused 3-digit number sharing that initial>,
  // scanning ALL existing product ids (not just this category) so it never collides with a legacy
  // id that happens to share the same first letter (e.g. Kids "K..." vs the legacy Women "K201/K202").
  const prefix = (category||"P").trim().charAt(0).toUpperCase() || "P";
  let maxN = 100;
  PRODUCTS.forEach(p=>{
    const m = String(p.id||"").match(new RegExp("^"+prefix+"(\\d+)$"));
    if(m) maxN = Math.max(maxN, parseInt(m[1],10));
  });
  return prefix + (maxN + 1);
}

  if(o.stage==="Booked") return `<span style="color:var(--muted);font-size:12px">Awaiting payment check</span>`;
  if(o.stage==="Dispatched") return `<button class="small-btn" data-act="deliver">Mark delivered</button>`;
  if(o.stage==="Delivered"){ const dl=reportDeadline(o); return dl&&Date.now()<=dl?`<span style="font-size:12px;color:var(--marigold)">Report window ${hoursLeft(dl)}h</span>`:`<span style="font-size:12px;color:var(--muted)">Window closed</span>`; }
  return "";
}
function wireOwnerOrderActions(){
  document.querySelectorAll("#ownerBody tr[data-id]").forEach(tr=>{
    tr.onclick=e=>{
      const act=e.target.closest("[data-act]")?.dataset.act; if(!act) return;
      const o=S.orders.find(x=>x.id===tr.dataset.id);
      if(act==="dispatch"){
        tr.lastElementChild.innerHTML=`<div class="dispatch-box">OTP will be emailed to customer on confirm.<button class="small-btn" data-act="confirmDispatch">Confirm dispatch</button></div>`;
      }
      if(act==="confirmDispatch"){
        o.otp=String(Math.floor(1000+Math.random()*9000)); toast(`OTP ${o.otp} emailed to ${o.email}`);
        o.stage="Dispatched"; o.dispatchedAt=new Date().toISOString(); save(); toast("Marked dispatched"); renderOwner();
        apiPostSafe("updateOrderStatus", {order_id:o.id, status:"Dispatched", otp:o.otp});
      }
      if(act==="deliver"){
        tr.lastElementChild.innerHTML=`<div class="dispatch-box"><input placeholder="Enter OTP from customer" data-role="otpIn" style="font-size:12px;padding:6px"><input type="file" accept="image/*" capture="environment" data-role="photoIn" style="font-size:11px"><button class="small-btn" data-act="confirmDeliver">Confirm delivered</button></div>`;
      }
      if(act==="confirmDeliver"){
        const cell=tr.lastElementChild;
        const otpIn=cell.querySelector('[data-role="otpIn"]')?.value.trim();
        if(otpIn!==o.otp){ toast("OTP does not match"); return; }
        const file=cell.querySelector('[data-role="photoIn"]')?.files[0];
        const finish=photo=>{
          o.deliveryPhoto=photo||null; o.stage="Delivered"; o.deliveredAt=new Date().toISOString(); save(); toast("Marked delivered"); renderOwner();
          // Demo note: Code.gs's delivery_photo_link just stores whatever string is sent (meant for a
          // pasted Drive link) — here we pass the captured photo as a data URL instead.
          apiPostSafe("updateOrderStatus", {order_id:o.id, status:"Delivered", delivery_photo_link:photo||""});
        };
        if(file){ const r=new FileReader(); r.onload=()=>finish(r.result); r.readAsDataURL(file); } else finish(null);
      }
    };
  });
}
function parseCSV(t){
  return t.trim().split(/\r?\n/).slice(1).map(l=>{const c=l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"').trim());
    return {date:c[0],narr:c[1]||"",ref:c[2]||"",credit:parseFloat(String(c[3]||"0").replace(/[₹,\s]/g,""))||0}}).filter(r=>r.date);
}
function sampleStatement(){
  const d=new Date().toLocaleDateString("en-GB");
  return `Date,Narration,Ref No,Credit
${d},UPI/627812345671/GD2610032217/sunita@okaxis,627812345671,849
${d},UPI/627898765432/Payment from Rahul/rahulv@ybl,627898765432,1899
${d},UPI/628100099911/NA/someone@paytm,628100099911,1299
${d},NEFT/RENT/ABC TRADERS,N2610045,15000`;
}
function runMatch(quiet){
  const used=new Set(); let v=0,mm=0,nf=0;
  S.orders.filter(o=>o.mode==="UPI"&&o.status!=="Verified"&&o.stage!=="Cancelled").forEach(o=>{
    const hit=stmt.find((r,i)=>!used.has(i)&&((o.utr&&(r.ref.includes(o.utr)||r.narr.includes(o.utr)))||r.narr.includes(o.id)));
    if(hit){used.add(stmt.indexOf(hit)); if(Math.abs(hit.credit-o.amount)<1){o.status="Verified";v++;apiPostSafe("verifyPayment",{utr:o.utr||hit.ref||"",matched_order_id:o.id,status:"Matched"})}else{o.status="Amount mismatch";o.paid=hit.credit;mm++;apiPostSafe("verifyPayment",{utr:o.utr||hit.ref||"",matched_order_id:o.id,status:"Unmatched — amount differs, check manually"})}}
    else if(o.utr){o.status="Not found";nf++}
  });
  save();
  const pend=S.orders.filter(o=>o.mode==="UPI"&&o.status!=="Verified"&&o.stage!=="Cancelled");
  $("#mres").innerHTML=`${quiet?"":`<div class="kpis" style="margin-top:12px"><div class="kpi"><b>${v}</b><span>Verified</span></div><div class="kpi"><b>${mm}</b><span>Amount mismatch</span></div><div class="kpi"><b>${nf}</b><span>Not found</span></div></div>`}
   <p class="sec-label" style="margin-top:14px">Needs a manual check (${pend.length})</p>
   ${pend.map(o=>{const cand=stmt.filter(r=>Math.abs(r.credit-o.amount)<1);return `<div class="note" style="margin-bottom:8px"><b>${o.id}</b> · ${esc(o.name)} · ${rs(o.amount)} · UTR ${o.utr||"—"} <span class="pill ${pillFor(o.status)}">${o.status}${o.paid?` (got ${rs(o.paid)})`:""}</span>
     ${o.paymentScreenshot?`<div style="margin-top:6px"><img src="${o.paymentScreenshot}" style="max-width:140px;border-radius:8px;cursor:zoom-in" data-shotzoom></div>`:""}
     <div style="margin-top:6px;font-size:13px;color:var(--muted)">${cand.length?`Statement credits of ${rs(o.amount)}:`:"No statement credit of the same amount."}</div>
     ${cand.map(r=>`<div style="font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:4px"><span style="min-width:0;overflow-wrap:anywhere">${esc(r.date)} · ${esc(r.narr)}</span><button class="small-btn" data-ver="${o.id}">Mark verified</button></div>`).join("")}
     <div style="margin-top:6px"><button class="small-btn" data-ver="${o.id}">Verified manually</button></div></div>`}).join("")||`<p style="color:var(--muted)">All UPI orders verified.</p>`}`;
  $("#mres").querySelectorAll("[data-shotzoom]").forEach(img=>{
    img.onclick=()=>{ const big=img.style.maxWidth!=="100%"; img.style.maxWidth=big?"100%":"140px"; img.style.cursor=big?"zoom-out":"zoom-in"; };
  });
  $("#mres").onclick=e=>{const b=e.target.closest("[data-ver]");if(!b)return;const o=S.orders.find(x=>x.id===b.dataset.ver);o.status="Verified";o.manual=true;save();runMatch(true);toast(`${o.id} marked verified`);apiPostSafe("verifyPayment",{utr:o.utr||"",matched_order_id:o.id,status:"Matched"})};
}

/* ================= Delivery Rules tab: cutoff, villages CRUD, same-day zone (center + radius) ================= */
function renderRulesTab(body){
  if(!S.config.zone) S.config.zone = { lat:SHOP_LOC.lat, lng:SHOP_LOC.lng, radiusKm:DEFAULT_ZONE_RADIUS_KM };
  body.innerHTML=`
    <label style="max-width:220px">Same-day order cutoff (24h hour)
      <input type="number" min="0" max="23" id="cutoffIn" value="${S.config.cutoffHour}">
    </label>
    <p class="sec-label" style="margin-top:18px">Villages</p>
    <div class="tbl-wrap"><table><thead><tr><th>Name (EN)</th><th>Name (HI)</th><th>Lat</th><th>Lng</th><th>Tier</th><th></th></tr></thead><tbody id="villRows">
    ${S.config.villages.map((v,i)=>`<tr data-i="${i}" class="vill-form">
      <td><input data-f="name" value="${esc(v.name)}" style="width:120px"></td>
      <td><input data-f="nameHi" value="${esc(v.nameHi||"")}" style="width:100px"></td>
      <td><input data-f="lat" type="number" step="0.001" value="${v.lat??""}" style="width:90px"></td>
      <td><input data-f="lng" type="number" step="0.001" value="${v.lng??""}" style="width:90px"></td>
      <td><select data-f="tier">
        <option value="same" ${v.tier==="same"?"selected":""}>same-day</option>
        <option value="next" ${v.tier==="next"?"selected":""}>next-day</option>
        <option value="next2" ${v.tier==="next2"?"selected":""}>2-day</option>
        <option value="other" ${v.tier==="other"?"selected":""}>not covered</option>
      </select></td>
      <td><button class="small-btn danger" data-del="${i}">Remove</button></td>
    </tr>`).join("")}
    </tbody></table></div>
    <button class="small-btn" id="addVillage" style="margin-top:8px">+ Add village</button>

    <p class="sec-label" style="margin-top:20px">Same-day delivery zone (center + radius)</p>
    <div class="zone-note">A customer is treated as same-day eligible whenever their fetched location is within <b>radius</b> km of the <b>center</b> point below — straight-line distance, not a drawn shape. Adjust the fields and the village distances below update live so you can see who falls inside vs outside.</div>
    <div class="oc-row" style="align-items:flex-end">
      <label style="max-width:160px">Center latitude<input type="number" step="0.0001" id="zoneLat" value="${S.config.zone.lat}"></label>
      <label style="max-width:160px">Center longitude<input type="number" step="0.0001" id="zoneLng" value="${S.config.zone.lng}"></label>
      <label style="max-width:140px">Radius (km)<input type="number" step="0.1" min="0" id="zoneRadius" value="${S.config.zone.radiusKm}"></label>
      <button class="small-btn" id="useShopLoc" type="button">Use shop location</button>
    </div>
    <div id="zoneVillageList" style="margin-top:10px"></div>
    <div class="oc-row" style="margin-top:10px">
      <button class="cta" id="saveRules" style="padding:8px 16px;font-size:13px">Save delivery rules</button>
    </div>

    <p class="sec-label" style="margin-top:28px">Home screen banners (up to 3)</p>
    <div class="zone-note">Images look best at <b>1200 × 500px</b> (landscape, 12:5 ratio) — upload at that size for no cropping. A different size still works, we'll auto-fit it to this shape. Leave a slot empty to not show a banner there.</div>
    <div class="oc-row" id="bannerSlots" style="align-items:flex-start;gap:16px"></div>`;
  function renderBannerSlots(){
    const wrap=$("#bannerSlots"); if(!wrap) return;
    wrap.innerHTML=[1,2,3].map(n=>{
      const cur=S.config["banner_"+n]||"";
      return `<div style="width:150px">
        <div style="aspect-ratio:12/5;background:var(--chip);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">
          ${cur?`<img src="${cur}" style="width:100%;height:100%;object-fit:cover">`:"No image"}
        </div>
        <input type="file" accept="image/*" data-banner="${n}" style="margin-top:6px;font-size:12px;width:100%">
        ${cur?`<button class="small-btn danger" data-rmbanner="${n}" style="margin-top:4px;width:100%">Remove</button>`:""}
      </div>`;
    }).join("");
    wrap.querySelectorAll("[data-banner]").forEach(inp=>{
      inp.onchange=async e=>{
        const n=inp.dataset.banner, f=e.target.files[0]; if(!f) return;
        const dataUrl = await resizeImageFile_(f, 1200, 0.7);
        S.config["banner_"+n]=dataUrl; save(); renderBannerSlots();
        await apiPostSafe("updateConfig", {["banner_"+n]:dataUrl});
        toast("Banner "+n+" saved"+(apiConfigured()?"":" (local demo — connect the backend to go live)"));
      };
    });
    wrap.querySelectorAll("[data-rmbanner]").forEach(btn=>{
      btn.onclick=async ()=>{
        const n=btn.dataset.rmbanner;
        S.config["banner_"+n]=""; save(); renderBannerSlots();
        await apiPostSafe("updateConfig", {["banner_"+n]:""});
        toast("Banner "+n+" removed");
      };
    });
  }
  renderBannerSlots();
  function syncVillages(){ save(); apiPostSafe("updateVillages", {villages:S.config.villages}); }
  $("#villRows").addEventListener("change", e=>{
    const tr=e.target.closest("tr"); if(!tr) return;
    const v=S.config.villages[+tr.dataset.i]; const f=e.target.dataset.f; if(!f) return;
    if(f==="lat"||f==="lng") v[f]=e.target.value===""?null:parseFloat(e.target.value);
    else v[f]=e.target.value;
    syncVillages();
    if(f==="lat"||f==="lng") renderZoneVillageList();
  });
  $("#villRows").addEventListener("click", e=>{
    const b=e.target.closest("[data-del]"); if(!b) return;
    S.config.villages.splice(+b.dataset.del,1); syncVillages(); renderOwner();
  });
  $("#addVillage").onclick=()=>{
    S.config.villages.push({id:"v"+Date.now(), name:"New village", nameHi:"", lat:SHOP_LOC.lat, lng:SHOP_LOC.lng, tier:"next"});
    syncVillages(); renderOwner();
  };
  $("#cutoffIn").onchange=()=>{
    S.config.cutoffHour=Math.max(0,Math.min(23,parseInt($("#cutoffIn").value)||DEFAULT_CUTOFF_HOUR));
    save(); apiPostSafe("updateConfig", {cutoff_hour:S.config.cutoffHour});
  };
  const onZoneInput=()=>{
    S.config.zone.lat=parseFloat($("#zoneLat").value)||SHOP_LOC.lat;
    S.config.zone.lng=parseFloat($("#zoneLng").value)||SHOP_LOC.lng;
    S.config.zone.radiusKm=Math.max(0,parseFloat($("#zoneRadius").value)||0);
    save(); renderZoneVillageList();
  };
  $("#zoneLat").oninput=onZoneInput; $("#zoneLng").oninput=onZoneInput; $("#zoneRadius").oninput=onZoneInput;
  $("#useShopLoc").onclick=()=>{
    const lat=(typeof SHOP_LOC!=="undefined"&&SHOP_LOC.lat)??S.config.shop_lat??SHOP_LOC.lat;
    const lng=(typeof SHOP_LOC!=="undefined"&&SHOP_LOC.lng)??S.config.shop_lng??SHOP_LOC.lng;
    $("#zoneLat").value=lat; $("#zoneLng").value=lng; onZoneInput();
  };
  $("#saveRules").onclick=async ()=>{
    save();
    await Promise.all([
      apiPostSafe("updateConfig", {cutoff_hour:S.config.cutoffHour, zone_center_lat:S.config.zone.lat, zone_center_lng:S.config.zone.lng, zone_radius_km:S.config.zone.radiusKm}),
      apiPostSafe("updateVillages", {villages:S.config.villages})
    ]);
    toast(apiConfigured() ? "Saved to the sheet — the customer app will see this on its next load." : "Saved — the customer app sees this immediately (same browser, local demo).");
  };
  renderZoneVillageList();
}
function renderZoneVillageList(){
  const wrap=$("#zoneVillageList"); if(!wrap) return;
  const zone=S.config.zone;
  const rows=S.config.villages.filter(v=>v.lat!=null).map(v=>{
    const d=haversineKm({lat:zone.lat,lng:zone.lng},v);
    const inside=d<=(zone.radiusKm||0);
    return `<tr><td>${esc(v.name)}</td><td>${d.toFixed(2)} km</td><td><span class="pill ${inside?"p-ok":"p-wait"}">${inside?"inside — same-day":"outside"}</span></td><td style="color:var(--muted)">(tier: ${esc(v.tier)})</td></tr>`;
  }).join("");
  wrap.innerHTML=`<p class="sec-label" style="margin:0 0 6px">Villages vs. this zone</p>
  <div class="tbl-wrap"><table><thead><tr><th>Village</th><th>Distance from center</th><th>Zone status</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="4" style="color:var(--muted)">No villages with coordinates yet.</td></tr>`}</tbody></table></div>`;
}

/* ================= Boot ================= */
/* No login anymore — this page opens straight into the console. Access is controlled only by
   this page's own URL being unlisted (not linked from the customer app) — see Code.gs's
   requireOwner_ for the server-side side of this change. */
(async function boot(){
  const loadingEl=document.createElement("div");
  loadingEl.id="bootLoading";
  loadingEl.style.cssText="position:absolute;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px";
  loadingEl.textContent="Loading…";
  $("#app").appendChild(loadingEl);
  await loadFromApi();
  loadingEl.remove();
  renderOwner();
})();
</script>
